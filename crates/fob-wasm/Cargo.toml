[package]
name = "fob-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Browser (WASM) bindings for fob-core — one crypto implementation, compiled for the web"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fob-core = { workspace = true, features = ["wasm"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
js-sys = "0.3"
uuid = { workspace = true, features = ["js"] }
# Enables the `crypto.getRandomValues` backend for the wasm32-unknown-unknown
# target (where there is no OS). On native targets this feature is a no-op.
# getrandom 0.4 (pulled transitively by crypto-common/aes-gcm) needs its own
# wasm feature; unifying it here makes the whole graph compile on wasm32.
getrandom = { version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
