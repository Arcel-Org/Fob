[package]
name = "fob-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Core cryptography and vault format for Fob — no I/O, pure logic"

[dependencies]
aes-gcm = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }
pbkdf2 = { workspace = true }
base64 = { workspace = true }

zeroize = { workspace = true }
subtle = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

getrandom = { workspace = true }

thiserror = { workspace = true }
base32 = { workspace = true }
argon2 = { workspace = true }
ml-kem = { workspace = true }
x25519-dalek = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# On wasm32-unknown-unknown the std SystemTime clock is unavailable (it
# panics), so we switch `unix_now()` to the JS `Date.now` clock. Enabled by
# fob-wasm. The js-sys dependency is target-gated so this never links on
# native targets; the code path is likewise cfg-gated to wasm32 (see
# vault.rs / totp.rs), so enabling the feature on native is a safe no-op.
[features]
wasm = ["dep:js-sys"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }
