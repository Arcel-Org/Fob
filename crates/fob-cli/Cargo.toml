[package]
name = "fob-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Fob USB device manager — install/format/status/recover only"
default-run = "fob"

[[bin]]
name = "fob"
path = "src/main.rs"

[dependencies]
fob-core = { workspace = true }
fob-host = { workspace = true }

clap = { workspace = true }
anyhow = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
