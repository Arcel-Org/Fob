[workspace]
members = [
    "crates/fob-core",
    "crates/fob-cli",
    "crates/fob-agent",
    "crates/fob-app",
    "crates/fob-host",
    "crates/fob-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Arcel-Org Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Crypto — RustCrypto stack
aes-gcm = { version = "0.11" }
hkdf = { version = "0.13" }
sha2 = { version = "0.11" }
hmac = { version = "0.13" }
sha1 = { version = "0.11" }
pbkdf2 = { version = "0.13" }
base64 = { version = "0.22" }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
ml-kem = { version = "0.3.2", default-features = false, features = ["alloc", "getrandom", "zeroize"] }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "getrandom", "zeroize", "precomputed-tables"] }

# Secret handling
zeroize = { version = "1.9", features = ["derive"] }
subtle = { version = "2" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
uuid = { version = "1", features = ["v4", "serde"] }

# Random
getrandom = { version = "0.2" }

# Error handling
thiserror = { version = "2" }
anyhow = { version = "1" }

# TUI
ratatui = { version = "0.30" }
crossterm = { version = "0.29" }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async runtime (for agent)
tokio = { version = "1", features = ["full"] }

# Native app shell (fob-app)
tauri = { version = "2" }
tauri-build = { version = "2" }

# Misc
base32 = { version = "0.5" }
arboard = { version = "3" }
directories = { version = "6" }

# Internal crates
fob-core = { path = "crates/fob-core" }
fob-host = { path = "crates/fob-host" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
# Even in dev, use debug-friendly but not completely unoptimized crypto
opt-level = 1
